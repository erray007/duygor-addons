name: Scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed == 'true' || steps.sweep.outputs.changed == 'true' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Scan the registered add-ons
        run: python -m duygor_registry.cli scan > "$RUNNER_TEMP/scan.json"
      # Issues are opened BEFORE the dedupe state is committed: if opening fails, the job stops,
      # the state is not pushed and the next scan raises the same issues again.
      - name: Open the issues the scan asked for
        run: python .github/scripts/open_issues.py "$RUNNER_TEMP/scan.json"
      - name: Build the index
        run: python -m duygor_registry.cli build-index --out site/index.json
      - name: Commit and push
        id: commit
        run: bash .github/scripts/commit_registry.sh
      - name: Sweep open form issues that lost their run
        id: sweep
        run: python .github/scripts/sweep_issues.py

  pages:
    needs: scan
    if: always() && needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
