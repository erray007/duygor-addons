name: Submit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.issue.user.type != 'Bot' &&
      (contains(github.event.issue.labels.*.name, 'eklenti-gonder') ||
      contains(github.event.issue.labels.*.name, 'eklenti-kaldir'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build the CLI input from the event file
        id: issue
        run: python .github/scripts/prepare_issue.py "$RUNNER_TEMP/issue.json"
      - name: Register or remove
        env:
          COMMAND: ${{ steps.issue.outputs.command }}
        run: python -m duygor_registry.cli "$COMMAND" --issue-json "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/result.json"
      - name: Build the index
        run: python -m duygor_registry.cli build-index --out site/index.json
      - name: Commit and push
        id: commit
        run: bash .github/scripts/commit_registry.sh
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
      - name: Write the comment
        run: python .github/scripts/comment_body.py "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/comment.md"
      - name: Comment and close
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER"
