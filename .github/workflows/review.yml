name: Review

# A maintainer approves (onaylandi) or rejects (reddedildi) an unapproved author's first submission
# by labelling its issue. Who added the label is checked against config.json maintainers by numeric
# user id; anyone else's label is removed again. Event data reaches the scripts only as the event
# file ($GITHUB_EVENT_PATH), never through expressions inside run.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event.label.name == 'onaylandi' || github.event.label.name == 'reddedildi')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.review.outputs.changed == 'true' || steps.sweep.outputs.changed == 'true' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Apply the decision
        id: review
        run: python .github/scripts/review_issue.py
      - name: Sweep open form issues that lost their run
        id: sweep
        run: python .github/scripts/sweep_issues.py

  pages:
    needs: review
    if: always() && needs.review.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
